<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pookie Bear</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/valentine.css">
</head>
<body class="valentine-page">

    <main class="row">
        <div class="column large-12" style="padding:1rem 0; text-align:center;">
            <p><a class="btn btn--primary" href="index.html">Back to site</a></p>
        </div>

        <div class="column large-12" style="padding:1rem 0 2rem 0; text-align:center;">
            <div id="pookie-card" style="max-width:520px;margin:0 auto;padding:1.2rem;">
                <img id="pookie-img" src="images/PookieBear.png" alt="Pookie Bear" style="max-width:320px;width:80%;height:auto;border-radius:12px;box-shadow:0 10px 30px rgba(176,58,91,0.12);display:block;margin:0 auto;">

                <div id="pookie-choices" style="margin-top:1.2rem;display:flex;gap:1rem;justify-content:center;">
                    <button id="yes-btn" class="btn btn--primary">Of course!</button>
                    <button id="no-btn" class="btn btn--stroke">no 😔</button>
                </div>
                <!-- Prompt shown after clicking 'Of course!' -->
                <div id="pookie-ask" style="display:none;margin-top:1.2rem;text-align:center;">
                    <p id="pookie-prompt" style="margin:0 0 .6rem 0;font-weight:600;color:#6b2138;">Hihi, now that you are my pookie boo, would you like to see some of our favourite memories together?</p>
                    <div style="display:flex;gap:1rem;justify-content:center;">
                        <button id="accept-btn" class="btn btn--primary">YAASSS QUEEENN</button>
                        <button id="maybe-btn" class="btn btn--stroke">Sure?</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="column large-12" style="padding:2rem 0 6rem 0;">

            <!-- Booklet: a small booklet-style viewer with two nav buttons -->
            <div id="booklet" class="booklet-container" style="display:none;">
                <h2 id="album-title" class="section-header-allcaps booklet-title" style="display:none;opacity:0;transition:opacity .45s;">Our Photo Album</h2>
                <div class="booklet-viewport">
                    <div class="booklet-page" data-index="0">
                        <div class="booklet-photo"><img src="images/SFsunrise.jpg" alt="SF sunrise"></div>
                        <div class="booklet-caption">Morning in SF</div>
                    </div>
                    <div class="booklet-page" data-index="1">
                        <div class="booklet-photo"><img src="images/montreal.jpeg" alt="Montreal"></div>
                        <div class="booklet-caption">Stroll in Montreal</div>
                    </div>
                    <div class="booklet-page" data-index="2">
                        <div class="booklet-photo"><img src="images/montreal2.jpeg" alt="Montreal 2"></div>
                        <div class="booklet-caption">Late afternoon</div>
                    </div>
                    <div class="booklet-page" data-index="3">
                        <div class="booklet-photo"><img src="images/mountain.jpg" alt="Mountain"></div>
                        <div class="booklet-caption">Mountain hikes</div>
                    </div>
                    <div class="booklet-page" data-index="4">
                        <div class="booklet-photo"><img src="images/widemountain.jpg" alt="Wide mountain"></div>
                        <div class="booklet-caption">Wide view</div>
                    </div>
                    <div class="booklet-page" data-index="5">
                        <div class="booklet-photo"><img src="images/fieldview.jpeg" alt="Field view"></div>
                        <div class="booklet-caption">Field day</div>
                    </div>
                    <div class="booklet-page" data-index="6">
                        <div class="booklet-photo"><img src="images/valley.jpg" alt="Valley"></div>
                        <div class="booklet-caption">Quiet valley</div>
                    </div>
                    <div class="booklet-page" data-index="7">
                        <div class="booklet-photo"><img src="images/stars.jpg" alt="Stars"></div>
                        <div class="booklet-caption">Starry night</div>
                    </div>
                    <div class="booklet-page" data-index="8">
                        <div class="booklet-photo"><img src="images/fogmountain.jpg" alt="Foggy mountain"></div>
                        <div class="booklet-caption">Misty morning</div>
                    </div>
                    <div class="booklet-page" data-index="9">
                        <div class="booklet-photo"><img src="images/calanques.jpeg" alt="Calanques"></div>
                        <div class="booklet-caption">Coastal hike</div>
                    </div>
                    <div class="booklet-page" data-index="10">
                        <div class="booklet-photo"><img src="images/savana.jpg" alt="Savana"></div>
                        <div class="booklet-caption">Sunset fields</div>
                    </div>
                    <div class="booklet-page" data-index="11">
                        <div class="booklet-photo"><img src="images/roadcloud.jpg" alt="Road"></div>
                        <div class="booklet-caption">Road trips</div>
                    </div>
                </div>

                <button id="prev-page" class="booklet-btn left" aria-label="Previous page">‹</button>
                <button id="next-page" class="booklet-btn right" aria-label="Next page">›</button>
            </div>
        </div>

    </main>

    <script src="js/plugins.js"></script>
    <script>
        // Open clicked album images in basicLightbox
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.folio-list a').forEach(function(link) {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    var src = link.getAttribute('href');
                    var instance = basicLightbox.create('<img src="' + src + '" style="max-width:90vw;max-height:90vh;display:block;margin:0 auto;">');
                    instance.show();
                });
            });
        });
    </script>

    <script>
        // Pookie interactivity: enhanced with dodge, stronger scaling, heart-pop, and confetti
        document.addEventListener('DOMContentLoaded', function() {
            var yes = document.getElementById('yes-btn');
            var no = document.getElementById('no-btn');
            var bookletEl = document.getElementById('booklet');
            var yesScale = 1;
            var noScale = 1;

            function applyScales() {
                yes.style.transform = 'scale(' + yesScale + ')';
                no.style.transform = 'scale(' + noScale + ')';
            }

            // show a confirmation prompt after initial "Of course!"
            yes.addEventListener('click', function() {
                // hide the original small choices and show the prompt
                var choices = document.getElementById('pookie-choices');
                var ask = document.getElementById('pookie-ask');
                if (choices) choices.style.display = 'none';
                if (ask) ask.style.display = 'block';

                // ensure prompt buttons are wired
                var accept = document.getElementById('accept-btn');
                var maybe = document.getElementById('maybe-btn');
                var acceptScale = 1, maybeScale = 1;

                function applyPromptScales() {
                    if (accept) accept.style.transform = 'scale(' + acceptScale + ')';
                    if (maybe) maybe.style.transform = 'scale(' + maybeScale + ')';
                }

                if (maybe) {
                    maybe.addEventListener('click', function() {
                        // clicking "Sure?" makes the first button grow and this one shrink
                        acceptScale = Math.min(6.0, acceptScale + 0.42);
                        maybeScale = Math.max(0.18, maybeScale - 0.34);
                        applyPromptScales();
                        if (accept) {
                            accept.classList.add('pulsate');
                            accept.style.transition = 'transform 0.32s cubic-bezier(.2,.8,.2,1)';
                            setTimeout(function(){ accept.classList.remove('pulsate'); }, 480);
                        }
                        if (maybe) {
                            maybe.style.transition = 'transform 0.32s cubic-bezier(.2,.8,.2,1)';
                        }
                    });
                }

                if (accept) {
                    accept.addEventListener('click', function() {
                        // reveal booklet now
                        var albumTitle = document.getElementById('album-title');
                        if (albumTitle) {
                            albumTitle.style.display = 'block';
                            setTimeout(function(){ albumTitle.style.opacity = 1; }, 20);
                        }
                        if (!bookletEl) bookletEl = document.getElementById('booklet');
                        if (bookletEl) {
                            bookletEl.style.display = 'block';
                            bookletEl.style.opacity = 0;
                            setTimeout(function(){ bookletEl.style.transition = 'opacity .4s ease'; bookletEl.style.opacity = 1; }, 40);
                            bookletEl.scrollIntoView({behavior:'smooth', block:'start'});
                            showBookletPage(0);
                        }
                        createConfetti(36);
                        triggerHeartPop(accept);
                    });
                }
            });

            // when 'no' is clicked, strongly grow yes and shrink no; also nudge/dodge the no button
            no.addEventListener('click', function(e) {
                yesScale = Math.min(6.0, yesScale + 0.42);
                noScale = Math.max(0.18, noScale - 0.34);
                applyScales();

                yes.classList.add('pulsate');
                yes.style.transition = 'transform 0.32s cubic-bezier(.2,.8,.2,1)';
                no.style.transition = 'transform 0.32s cubic-bezier(.2,.8,.2,1)';
                setTimeout(function() { yes.classList.remove('pulsate'); }, 480);

                // bigger jump away on click (more dramatic)
                var dx = (Math.random() * 2 - 1) * 520;
                var dy = (Math.random() * 2 - 1) * 56;
                no.style.transition = 'transform 0.45s cubic-bezier(.1,.9,.2,1)';
                no.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + noScale + ')';
                // return to scaled position after a moment
                setTimeout(function(){ no.style.transform = 'scale(' + noScale + ')'; }, 900);
            });

            // dramatic dodge when hovered
            no.addEventListener('mouseenter', function() {
                var dx = (Math.random() * 2 - 1) * 420;
                var dy = (Math.random() * 2 - 1) * 40;
                no.style.transition = 'transform 0.42s cubic-bezier(.15,.9,.2,1)';
                no.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + noScale + ')';
                // slide back to its scaled spot after a short time
                setTimeout(function(){ no.style.transform = 'scale(' + noScale + ')'; }, 700);
            });

            // reset transforms when mouse leaves card area (so button doesn't escape forever)
            var card = document.getElementById('pookie-card');
            if (card) {
                card.addEventListener('mouseleave', function() {
                    noScale = Math.max(0.22, noScale); // ensure not too tiny
                    yesScale = Math.max(1, yesScale);
                    no.style.transform = 'scale(' + noScale + ')';
                    yes.style.transform = 'scale(' + yesScale + ')';
                });
            }
        });

        // Booklet navigation state and functions
        var currentBookletPage = 0;
        function showBookletPage(index) {
            var pages = document.querySelectorAll('.booklet-page');
            if (!pages || pages.length === 0) return;
            currentBookletPage = Math.max(0, Math.min(index, pages.length - 1));
            pages.forEach(function(p) { p.classList.remove('active','left','right'); p.style.display = 'none'; });
            var current = pages[currentBookletPage];
            if (current) {
                current.style.display = 'block';
                // small page-in animation
                requestAnimationFrame(function(){ current.classList.add('active'); });
            }
            // show/hide nav buttons
            var prev = document.getElementById('prev-page');
            var next = document.getElementById('next-page');
            if (prev) prev.style.visibility = (currentBookletPage === 0) ? 'hidden' : 'visible';
            if (next) next.style.visibility = (currentBookletPage === pages.length - 1) ? 'hidden' : 'visible';
        }

        document.addEventListener('DOMContentLoaded', function() {
            var prevBtn = document.getElementById('prev-page');
            var nextBtn = document.getElementById('next-page');
            if (prevBtn) prevBtn.addEventListener('click', function(){ showBookletPage(currentBookletPage - 1); });
            if (nextBtn) nextBtn.addEventListener('click', function(){ showBookletPage(currentBookletPage + 1); });
        });

        // Create confetti elements that fall and then are removed
        function createConfetti(count) {
            var container = document.createElement('div');
            container.className = 'confetti-container';
            document.body.appendChild(container);
            var colors = ['#ff6b9a','#ffd166','#ff8fab','#f4a7b9','#ffb3c6','#ffc6e2','#ffdeeb'];
            for (var i=0;i<count;i++){
                var piece = document.createElement('div');
                piece.className = 'confetti-piece';
                var left = Math.random() * 100;
                piece.style.left = left + 'vw';
                piece.style.top = '-6vh';
                piece.style.background = colors[Math.floor(Math.random()*colors.length)];
                var delay = Math.random() * 0.6;
                var dur = 1.6 + Math.random() * 1.8;
                piece.style.animationDuration = dur + 's';
                piece.style.animationDelay = delay + 's';
                piece.style.opacity = 0.95;
                container.appendChild(piece);
            }
            setTimeout(function(){ container.parentNode && container.parentNode.removeChild(container); }, 5200);
        }

        // Create a small heart element positioned over the button and animate it
        function triggerHeartPop(btn) {
            var rect = btn.getBoundingClientRect();
            var heart = document.createElement('div');
            heart.className = 'heart-pop';
            var shape = document.createElement('div');
            shape.className = 'heart-shape';
            heart.appendChild(shape);
            document.body.appendChild(heart);
            heart.style.left = (rect.left + rect.width/2 - 24) + 'px';
            heart.style.top = (rect.top + rect.height/2 - 24) + 'px';
            // start animation
            requestAnimationFrame(function(){ heart.classList.add('animate'); });
            setTimeout(function(){ heart.parentNode && heart.parentNode.removeChild(heart); }, 900);
        }
    </script>

</body>
</html>
